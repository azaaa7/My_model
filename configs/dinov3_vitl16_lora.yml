type: train

# Data
# *_samples accepts one .npy path or any number of .npy paths.
train_samples:
  - "./flist/DAVIS-VI_tra_DVI_30.npy"
  - "./flist/DAVIS-VI_tra_CPNET_30.npy"
  # - "./flist/DAVIS-VI_tra_OPN_30.npy"
val_samples:
  - "./flist/DAVIS-VI_val_DVI_20.npy"
  - "./flist/DAVIS-VI_val_CPNET_20.npy"
  # - "./flist/DAVIS-VI_val_OPN_20.npy"
test_samples:
  # When --type test: all 3 subsets are run sequentially (hard-coded suite).
  # The first entry below is used for single-test / --type val mode.
  - "./flist/DAVIS-VI_val_DVI_20.npy"
  - "./flist/DAVIS-VI_val_CPNET_20.npy"
  - "./flist/DAVIS-VI_val_OPN_20.npy"
input_size: 512
gt_ratio: 1
num_frames: 1
val_num_frames: 3
dataset_repeat: 1
batch_size: 16
num_workers: 6

# DINOv3 ViT-L/16 pretrained backbone.
# Place the weight file in My_model/ or replace this with an absolute path.
dinov3_weights: "~/.cache/torch/hub/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"

# Prefer a local clone of https://github.com/facebookresearch/dinov3.
# If empty, the script checks ./dinov3, ../dinov3, and cwd/dinov3.
dinov3_repo: "./dinov3"
allow_hub_download: false

# Model — Single-layer DINOv3 Encoder (last block, 1024-dim) + Simple Conv Decoder
freeze_backbone: true
checkpoint: ""

# Optional LoRA fine-tuning for DINOv3 ViT attention layers.
# Default targets match official DINOv3 block names: blocks.*.attn.qkv/proj.
use_lora: true
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.1
# lora_targets: "attn.qkv,attn.proj,mlp.fc1,mlp.fc2"
lora_targets: "attn.qkv"
# lora_layers: "all" means all 24 blocks (0-23).
# Use e.g. "5-23" or "11,12,13,...23" to limit LoRA to deeper layers only.
lora_layers: "all"

# ── Decoder architecture ─────────────────────────────────────────────────
# Set use_dpt_fpn: true to use multi-layer DINO features + DPT neck + FPN decoder.
# Set use_dpt_fpn: false for legacy single-layer + ProgressiveDecoder.
use_dpt_fpn: false
extract_layers: "11,15,19,23"    # 0-based DINOv3 block indices
neck_channels: 256              # DPT reassemble output / FPN channel dim

# ── Loss configuration ────────────────────────────────────────────────────
# Supported: wbce, dice, focal, iou, bce, tversky, edge
# Each active loss needs a "weight".  Set weight=0 or comment out to disable.
loss:
  # wbce:
  #   weight: 1.0
  #   max_pos_weight: 10.0
  # dice:
  #   weight: 1.0
  #   smooth: 1.0e-6
  # focal:
  #   weight: 0.5
  #   alpha: 0.25
  #   gamma: 2.0
  edge:
    weight: 0.1
    edge_lambda: 20.0    # boundary emphasis (paper default 20)
    kernel_size: 3
  # iou:
  #   weight: 1.0
  #   smooth: 1.0e-6
  bce:
    weight: 1.0
  # tversky:
  #   weight: 0.2
  #   alpha: 0.3
  #   beta: 0.7
  #   smooth: 1.0e-6

# Train
n_epochs: 2000
learning_rate: 3.0e-4
weight_decay: 1.0e-4
seed: 666666
amp: true
gpu_id: 1
grad_accum_steps: 1
validate_every: 20
threshold: 0.5
eval_frame_chunk: 5

# LR scheduler — warmup + cosine decay
# scheduler: "cosine" | "plateau"
scheduler: "cosine"
warmup_epochs: 20
min_lr: 1.0e-6

# Plateau scheduler options (only used when scheduler="plateau")
plateau_patience: 3
plateau_threshold: 0.003
plateau_cooldown: 1

# Output
save_dir: "runs/dinov3_vitl16_lora"
visualization_dir: "runs/dinov3_vitl16_lora/vis"
