# DINOv3 ViT-L/16 + Semantic-Anchor MFCE + P4 Gated TFCU
# 本配置对应 E2: SemanticAnchorMFCE + ASPP + P4 gated TFCU, detail stem 默认关闭。

# 运行模式: train / val / test。命令行 --type 会覆盖这里。
type: train

# ── Data ──────────────────────────────────────────────────────────────────
# 训练样本索引。支持单个 .npy 路径或路径列表。
train_samples:
  - "./flist/DAVIS-VI_tra_DVI_30.npy"
  - "./flist/DAVIS-VI_tra_CPNET_30.npy"

# 快速验证样本索引。训练中 validate_every 触发时使用。
val_samples:
  - "./flist/DAVIS-VI_val_DVI_20.npy"
  - "./flist/DAVIS-VI_val_CPNET_20.npy"

# 测试样本索引。test 模式会按脚本里的 TEST_SUITE 逐项评估。
test_samples:
  - "./flist/DAVIS-VI_val_DVI_20.npy"
  - "./flist/DAVIS-VI_val_CPNET_20.npy"
  - "./flist/DAVIS-VI_val_OPN_20.npy"

# 输入图像边长。DINOv3 ViT-L/16 要求能被 16 整除；512 会得到 32x32 token map。
input_size: 512

# 正样本采样比例，沿用数据集逻辑。
gt_ratio: 1

# ── Temporal clip config ──────────────────────────────────────────────────
# 每个视频样本取多少个 clip，对应模型输入 [B, N, T, 3, H, W] 里的 N。
num_clips: 2

# 每个 clip 取多少帧，对应输入里的 T。TFCU 模式允许偶数帧。
num_frames: 4

# clip 之间的起始帧步长。1 表示相邻滑动。
clip_stride: 1

# DINO encoder 分块前向的帧数上限。越小越省显存但更慢；0 表示不分块。
encoder_chunk: 2

# 非 TFCU 旧验证路径的帧数保留项；当前 TFCU full-window 逻辑主要看 num_frames。
val_num_frames: 3

# 数据集重复倍数。>1 可人为增加一个 epoch 内的训练迭代数。
dataset_repeat: 1

# 单进程 batch size。DDP 总 batch 约等于 batch_size * nproc_per_node * grad_accum_steps。
batch_size: 1

# DataLoader worker 数。
num_workers: 4

# 梯度累积步数，用来扩大等效 batch。
grad_accum_steps: 8

# 训练数据增强概率。0 关闭，1 总是增强。
augment_prob: 0.75

# val/test 自动展开 full video windows 时最多保留多少个 clips，防止显存爆。
test_max_clips: 4

# false: 训练中验证走快速 val；true: val 像 test 一样顺序 window 并用 valid_mask 过滤 padding。
val_full_video: false

# true: test 默认跑完整视频顺序 window，所有有效帧参与指标。
test_full_video: true

# ── DINOv3 backbone ──────────────────────────────────────────────────────
# DINOv3 权重路径。权重目录不应提交到 git。
dinov3_weights: "./dinov3/dinov3_weight/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"

# 本地 dinov3 repo 路径，需包含 hubconf.py。
dinov3_repo: "./dinov3"

# 是否允许 torch hub 下载权重。服务器训练建议 false，避免意外联网。
allow_hub_download: false

# ── Model ────────────────────────────────────────────────────────────────
# true: 使用 DINO 多层特征 + neck + decoder；false: 使用旧 single-layer head。
use_dpt_fpn: true

# 新结构开关。semantic_anchor_mfce 表示在 32x32 token map 上做 MFCE layer attention。
neck_variant: semantic_anchor_mfce

# 抽取的 DINO block。它们都是 1/16 分辨率，不代表 CNN 式 P2/P3/P4/P5。
extract_layers: "5,11,17,23"

# neck/ASPP/TFCU 的主通道数。
neck_channels: 256

# LightASPP 在 P4 上使用的 dilation rates，用来扩大感受野但不建立主 P5。
semantic_aspp_rates: "1,2,4,8"

# 是否启用 RGB detail stem。false 对应第一阶段；true 会把高分辨率细节注入 P3/P2/P1。
use_detail_stem: false

# detail stem 是否用 sigmoid gate 控制注入强度。
detail_stem_gated: true

# detail stem gate 初始 logit。-3 对应 sigmoid 约 0.047，初始影响较小。
detail_gate_init: -3.0

# 旧 fused32 pyramid 的 image stem skip 开关。semantic_anchor_mfce 不使用这个分支。
use_image_stem_skip: false

# 是否冻结 DINO backbone。LoRA 参数会单独保持可训练。
freeze_backbone: true

# 初始化 checkpoint。空字符串表示从 DINO 预训练权重和随机 neck/decoder 开始。
checkpoint: ""

# ── LoRA ──────────────────────────────────────────────────────────────────
# 是否给 DINO backbone 注入 LoRA。
use_lora: true

# LoRA rank，越大可训练容量越强，也越占显存。
lora_rank: 32

# LoRA scaling alpha。
lora_alpha: 64

# LoRA dropout。
lora_dropout: 0.1

# LoRA 注入目标。完整目标覆盖 attention projection 和 MLP 两层，符合 semantic-anchor 主实验设置。
lora_targets: "attn.qkv,attn.proj,mlp.fc1,mlp.fc2"

# LoRA 注入哪些 ViT block。"all" 表示全部 block；也可写 "18,19,20,21,22,23"。
lora_layers: "all"

# ── TFCU-Inpaint Adapter ──────────────────────────────────────────────────
# 是否启用 VideoInpaintTFCU wrapper。
use_tfcu_adapter: true

# semantic_anchor_mfce 下必须是 P4 或 NONE。P4 表示在 semantic anchor 上做 gated TFCU。
temporal_insert_level: P4

# P4 TFCU gate 初始 logit。-3 对应 sigmoid 约 0.047，训练初期近似原模型。
p4_gate_init: -3.0

# memory attention 保留多少个历史 clip。
memory_len: 4

# 是否启用跨 clip memory attention。false 时只保留 local temporal difference。
use_memory: true

# true: 存入 memory 的历史特征 detach，避免跨 clip 反传导致显存和梯度不稳定。
detach_memory: true

# true: memory attention 前把 32x32 pool 到 16x16，做完再上采样回 32x32，省显存并提速。
use_spatial_pool: true

# ── Optimizer (per-component learning rates) ──────────────────────────────
# 基础学习率。分组 lr 未设置时会回退到这个值。
learning_rate: 1.0e-4

# TFCU adapter 学习率。
lr_temporal: 1.0e-4

# neck/context/decoder/detail stem 学习率。
lr_decoder:  1.0e-4

# LoRA/backbone 可训练参数学习率，通常比 decoder 小。
lr_lora:     1.0e-5

# Adam weight decay。
weight_decay: 1.0e-4

# ── LR scheduler ──────────────────────────────────────────────────────────
# scheduler 类型。当前推荐 cosine。
scheduler: "cosine"

# warmup epoch 数。
warmup_epochs: 10

# cosine 最低学习率。
min_lr: 1.0e-6

# plateau scheduler 参数，仅 scheduler="plateau" 时使用。
plateau_patience: 3
plateau_threshold: 0.003
plateau_cooldown: 1

# ── Loss ──────────────────────────────────────────────────────────────────
# 每个 loss 下的 weight 表示该项在总 loss 中的权重。
loss:
  # Dice loss，提升前景区域重叠。
  dice:
    weight: 1.0
    smooth: 1.0e-6
  # BCEWithLogits loss，稳定像素级二分类。
  bce:
    weight: 0.5
  # Tversky loss，alpha/beta 控制 FP/FN 惩罚。
  tversky:
    weight: 0.2
    alpha: 0.3
    beta: 0.7
    smooth: 1.0e-6
  # 边界监督，帮助 mask 边缘。
  boundary:
    weight: 0.2
  # 时序差分监督，约束相邻帧预测变化。
  temporal_delta:
    weight: 0.1

# ── Training ──────────────────────────────────────────────────────────────
# 最大训练 epoch。
n_epochs: 2000

# 随机种子。DDP 会按 rank 加偏移。
seed: 666666

# 是否启用 AMP 混合精度。
amp: true

# 单卡模式下使用的 GPU id。DDP 模式下由 LOCAL_RANK 接管。
gpu_id: 0

# DDP backend，NVIDIA GPU 使用 nccl。
dist_backend: nccl

# DDP 是否查找未使用参数。当前结构正常应为 false；调试 unused param 时可临时 true。
ddp_find_unused_parameters: false

# 断点恢复时是否恢复 optimizer state。换卡数或改结构时建议 false。
resume_optimizer: false

# true: optimizer/scheduler state 不匹配时直接报错；false: 跳过并继续训练。
strict_resume_optimizer: false

# true: 用普通 python 启动时，脚本会按下面的多卡配置自动 relaunch torchrun。
auto_torchrun: true

# 物理 GPU 列表。比如 "2,3,4,5,6,7" 会在子进程内映射成 cuda:0..cuda:5。
cuda_visible_devices: "2,3,4,5,6,7"

# 单机进程数。必须 <= cuda_visible_devices 里的 GPU 数；也可写 "auto"。
nproc_per_node: 6

# 单机训练建议 true，会自动设置 rendezvous。
torchrun_standalone: true

# 多机训练参数。单机保持默认即可。
nnodes: 1
node_rank: 0
master_addr: ""
master_port: ""

# 每个进程的 OpenMP 线程数。多卡训练通常设 1，避免 CPU 线程抢占。
omp_num_threads: 1

# torchrun 日志目录。
torchrun_log_dir: "runs/semantic_anchor_mfce_p4_tfcu/torchrun_logs"

# torchrun --tee 参数。3 表示同时输出 stdout/stderr 并写日志，便于定位 rank 报错。
torchrun_tee: "3"

# 每多少个 epoch 做一次 validation。
validate_every: 20

# 当前代码按 val_iou 保存 best_iou.pt；该字段作为实验记录保留。
save_best_by: val_iou

# sigmoid 后二值化阈值。
threshold: 0.5

# eval 时每次送入模型的帧 chunk。小一点省显存，慢一点。
eval_frame_chunk: 1

# ── Output ────────────────────────────────────────────────────────────────
# checkpoint、log、config.json 保存目录。runs/ 已被 .gitignore 忽略。
save_dir: "runs/semantic_anchor_mfce_p4_tfcu"

# 可视化输出目录。
visualization_dir: "runs/semantic_anchor_mfce_p4_tfcu/vis"
